
name: TurboSave Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Find and start bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
        run: |
          echo "Checking repository files..."
          ls -la
          BOT_FILE=$(find . -type f -name "turbosave_bot.py" -print -quit)

          if [ -z "$BOT_FILE" ]; then
            echo "ERROR: turbosave_bot.py not found!"
            exit 1
          fi

          echo "Starting: $BOT_FILE"
          python "$BOT_FILE"
